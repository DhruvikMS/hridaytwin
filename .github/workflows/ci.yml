name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests (leakage, determinism, twin, guardrails, FHIR)
        run: pytest
      - name: End-to-end pipeline on a reduced cohort
        run: python run_pipeline.py --quick
      - name: Console contains data and no remote scripts
        run: |
          grep -q '"patients":\[' dashboard/index.html
          ! grep -q '<script src=' dashboard/index.html
